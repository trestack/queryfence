cases:
  - id: alias-001
    clause: [RP-2, RP-5]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.status = ? AND o.tenant_id IN (?, ?)
    expect: []
    reason: 'The IN predicate is qualified with the occurrence''s alias and sits in the AND chain.'

  - id: alias-002
    clause: [RP-5]
    policy: default
    dialect: ansi
    sql: |-
      SELECT purchase_order.id FROM purchase_order WHERE purchase_order.tenant_id = ?
    expect: []
    reason: 'Without an alias the table name is a valid qualifier.'

  - id: alias-003
    clause: [RP-5]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id, c.rate FROM purchase_order o JOIN currency c ON c.code = o.currency_code
      WHERE c.tenant_id = ?
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: purchase_order
        alias: o
        message: 'purchase_order (o) has no tenant filter. Add "o.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'The predicate is bound to the unprotected currency alias, so purchase_order stays unfenced.'

  - id: alias-004
    clause: [RP-5]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id, i.sku FROM purchase_order o JOIN order_item i ON i.order_id = o.id
      WHERE tenant_id = ?
    expect:
      - rule: tenant-isolation
        code: AMBIGUOUS_COLUMN
        table: purchase_order
        alias: o
        message: 'Column "tenant_id" is not qualified in a query block that uses several tables, so it protects none of them. Qualify it with the table alias, for example "o.tenant_id = ?".'
    reason: 'An unqualified column in a two-table block cannot be bound to either table: qualify the column with its alias.'

  - id: alias-005
    clause: [RP-5]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o JOIN currency c ON c.code = o.currency_code
      WHERE tenant_id = ?
    expect:
      - rule: tenant-isolation
        code: AMBIGUOUS_COLUMN
        table: purchase_order
        alias: o
        message: 'Column "tenant_id" is not qualified in a query block that uses several tables, so it protects none of them. Qualify it with the table alias, for example "o.tenant_id = ?".'
    reason: 'The second table makes the unqualified column ambiguous even though only one table is protected.'

  - id: alias-006
    clause: [RP-5]
    policy: default
    dialect: ansi
    sql: |-
      SELECT purchase_order.id FROM purchase_order purchase_order WHERE purchase_order.tenant_id = ?
    expect: []
    reason: 'An alias equal to the table name still resolves the qualifier.'
