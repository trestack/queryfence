# Named policies referenced by corpus cases through `policy: <name>`.
# Same schema as queryfence.yml (see docs/DESIGN.md "Policy file").

default:
  version: 1
  mode: FAIL
  onUnparseable: FAIL
  rules:
    - id: tenant-isolation
      type: require-predicate
      column: tenant_id
      tables: [purchase_order, order_item, invoice]
    - id: no-unbounded-update
      type: update-without-where
    - id: no-unbounded-delete
      type: delete-without-where
# Tables used by the corpus:
#   purchase_order, order_item, invoice   protected, each has tenant_id
#   currency                              global reference data, not protected
